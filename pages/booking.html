<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Mượn / Đặt Phòng Học</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="booking-card">
    <h2>Yêu Cầu Đặt / Mượn Phòng Học</h2>
    
    <div id="alertBox" class="alert-message"></div>

    <form id="bookingForm">
        <div class="form-group">
            <label for="roomCode">Chọn phòng học (*):</label>
            <select id="roomCode" required>
                <option value="">-- Chọn phòng --</option>
                <option value="A101">Phòng A101</option>
                <option value="A102">Phòng A102</option>
                <option value="B201">Phòng B201</option>
                <option value="B202">Phòng B202</option>
            </select>
        </div>

        <div class="form-group">
            <label for="bookingDate">Ngày mượn (*):</label>
            <input type="date" id="bookingDate" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="startTime">Giờ bắt đầu (*):</label>
                <input type="time" id="startTime" required>
            </div>
            <div class="form-group">
                <label for="endTime">Giờ kết thúc (*):</label>
                <input type="time" id="endTime" required>
            </div>
        </div>

        <div class="form-group">
            <label for="requesterName">Họ và tên người mượn (*):</label>
            <input type="text" id="requesterName" placeholder="Ví dụ: Nguyễn Văn A" required>
        </div>

        <div class="form-group">
            <label for="purpose">Mục đích / Ghi chú:</label>
            <textarea id="purpose" rows="3" placeholder="Ví dụ: Học bù môn Lập trình Web, Sinh hoạt CLB..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Gửi yêu cầu đặt phòng</button>
    </form>
</div>

<script src="booking.js"></script>
</body>
</html>
