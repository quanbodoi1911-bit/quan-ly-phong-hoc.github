<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ</title>

    <link rel="stylesheet" href="trang-chu-va-bao-cao.css">
</head>

<body>

    <!-- Lượng: TRANG CHỦ VÀ THỐNG KÊ -->

    <div id="home" class="page">

        <h1>Trang chủ</h1>

        <p>Chào mừng đến với hệ thống quản lý phòng học.</p>

        <div class="cards">

            <div class="card">
                <p>Tổng số phòng</p>
                <h2 id="totalRooms">0</h2>
            </div>

            <div class="card">
                <p>Phòng đang sử dụng</p>
                <h2 id="usedRooms">0</h2>
            </div>

            <div class="card">
                <p>Phòng trống</p>
                <h2 id="emptyRooms">0</h2>
            </div>

            <div class="card">
                <p>Yêu cầu chờ duyệt</p>
                <h2 id="pendingRequests">0</h2>
            </div>

        </div>

        <div class="welcome-box">
            <h3>Thông tin hệ thống</h3>

            <p>
                Website hỗ trợ quản lý phòng học, đặt phòng,
                lịch học và yêu cầu sử dụng phòng.
            </p>
        </div>

    </div>

    <script src="trang-chu-va-bao-cao.js"></script>

</body>
</html>
