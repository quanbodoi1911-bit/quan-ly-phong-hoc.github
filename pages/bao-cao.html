<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo thống kê - Quản lý phòng học</title>
    <link rel="stylesheet" href="trang-chu-va-bao-cao.css">
</head>

<body>

    <div id="app">
        <!-- Sidebar điều hướng -->
        <div class="sidebar">
            <h2>QUẢN LÝ<br>PHÒNG HỌC</h2>
            <a href="#" class="menu-link" data-page="home">Trang chủ</a>
            <a href="#" class="menu-link" data-page="rooms">Quản lý phòng học</a>
            <a href="#" class="menu-link" data-page="calendar">Lịch học</a>
            <a href="#" class="menu-link" data-page="booking">Đặt phòng</a>
            <a href="#" class="menu-link" data-page="requests">Yêu cầu đặt phòng</a>
            <a href="#" class="menu-link" data-page="users">Người dùng</a>
            <a href="#" class="menu-link active" data-page="reports">Báo cáo</a>
            <button id="logoutBtn" class="logout-btn">Đăng xuất</button>
        </div>

        <!-- Khu vực nội dung chính -->
        <div class="main">
            <div class="header">
                <input type="text" id="searchInput" placeholder="Tìm kiếm dữ liệu...">
                <span id="currentUser">Quản trị viên</span>
            </div>

            <!-- Trang Báo cáo -->
            <div id="reports" class="page">
                <h1>Báo cáo thống kê</h1>

                <div class="cards">
                    <div class="card">
                        <p>Tổng số phòng</p>
                        <h2 id="reportTotal">0</h2>
                    </div>
                    <div class="card">
                        <p>Phòng đang sử dụng</p>
                        <h2 id="reportUsed">0</h2>
                    </div>
                    <div class="card">
                        <p>Phòng trống</p>
                        <h2 id="reportEmpty">0</h2>
                    </div>
                    <div class="card">
                        <p>Yêu cầu chờ duyệt</p>
                        <h2 id="reportPending">0</h2>
                    </div>
                </div>

                <button type="button" id="printReportBtn" style="margin-top: 15px;">
                    In báo cáo
                </button>
            </div>
        </div>
    </div>

    <script src="trang-chu-va-bao-cao.js"></script>

</body>

</html>
